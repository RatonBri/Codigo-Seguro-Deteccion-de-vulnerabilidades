name: VibeShield Security

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Codigo-seguro
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ast]"

      - name: Run automated tests
        run: pytest -q

      - name: Run security scan
        run: |
          cuerpo scan . \
            --level deep \
            --format sarif \
            --output reports \
            --fail-on critical

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/report.sarif

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Codigo-seguro-security-report
          path: reports/
          retention-days: 14